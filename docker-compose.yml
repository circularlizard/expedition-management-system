services:
  db:
    image: mariadb:lts
    restart: unless-stopped
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: wordpress
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  wordpress:
    image: wordpress:php8.4-apache
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./wordpress-env/wp-content:/var/www/html/wp-content
      - ./tools:/var/www/html/tools
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp2a_
      WORDPRESS_CONFIG_EXTRA: |
        define( 'EMS_TEST_MODE', true );
        define( 'WP_HOME', 'https://localhost' );
        define( 'WP_SITEURL', 'https://localhost' );
        define( 'FORCE_SSL_ADMIN', true );
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      wordpress:
        condition: service_started

  wpcli:
    image: wordpress:cli-php8.4
    profiles: ["cli"]
    volumes:
      - ./wordpress-env/wp-content:/var/www/html/wp-content
      - ./tools:/var/www/html/tools
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp2a_
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: ["wp", "--allow-root"]

  wpcron:
    image: wordpress:cli-php8.4
    restart: unless-stopped
    volumes:
      - ./wordpress-env/wp-content:/var/www/html/wp-content
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: wordpress
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_TABLE_PREFIX: wp2a_
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_started
    entrypoint: ["/bin/sh", "-c", "while true; do wp cron event run --due-now --allow-root 2>/dev/null; sleep 30; done"]

volumes:
  db_data:
  caddy_data:
  caddy_config:
